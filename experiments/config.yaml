# =====================================================================
# 实验配置：所有可调参数都在这里，不要散落到代码中
# =====================================================================

# ---- 实验规模 ----
# 注意：默认值是"快速验证流程"用的小规模，正式实验请改成注释里的投稿标准
dim: 30                 # 维度；正式实验：10 / 30 / 50 / 100
max_fes: 20000          # 最大评价次数；正式实验：300000（或 10000 * dim）
runs: 5                 # 独立运行次数；正式实验：**30**
pop_size: 50            # 种群规模

# ---- 基准函数 ----
functions:
  - Sphere
  - Rosenbrock
  - Rastrigin
  - Ackley
  - Griewank
  - Schwefel

# ---- 参与对比的算法 ----
algorithms:
  PSO:
    pop_size: 50
  DE:
    pop_size: 50
  GWO:
    pop_size: 50

# ---- 输出 ----
output_dir: results
save_curves: true       # 是否保存收敛曲线数据
make_plots: true        # 是否生成图片
